name: Go examples

on:
  push:
    paths: ['examples/go/**']
  pull_request:
    paths: ['examples/go/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/go/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
